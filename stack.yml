version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: midb
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - red_app

  web:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./app.js:/app/app.js
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://admin:password123@db:5432/midb
    command: sh -c "npm install pg && node app.js"
    depends_on:
      - db
    networks:
      - red_app

volumes:
  pg_data:

networks:
  red_app:
